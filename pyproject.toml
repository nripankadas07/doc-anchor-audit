[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-anchor-audit"
version = "0.1.0"
description = "Checks local Markdown files and heading fragments offline, with source lines and explicit coverage warnings."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dr. Nripanka Das"}]
dependencies = []

[project.urls]
Repository = "https://github.com/nripankadas07/doc-anchor-audit"
Issues = "https://github.com/nripankadas07/doc-anchor-audit/issues"

[project.scripts]
doc-anchor-audit = "doc_anchor_audit:main"

[tool.setuptools]
py-modules = ["doc_anchor_audit"]
